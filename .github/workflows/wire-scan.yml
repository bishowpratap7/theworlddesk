name: World Desk Wire Scan

# Runs inside GitHub itself (GitHub Actions scheduled workflow).
# GitHub cron uses UTC. Two slots per hour (:18 and :48): GitHub is known to
# delay or drop individual scheduled runs, so a dropped slot costs ~30 min.
on:
  schedule:
    - cron: "18,48 * * * *"
  workflow_dispatch:
  push:
    branches: [pinger]

permissions:
  contents: write

concurrency:
  group: world-desk-wire-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan the wires and update the page
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan public feeds
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 tools/scan.py

      - name: Commit and push wire updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wire.json index.html feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wire changes to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Wire update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main

      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -f "cb8e34963ecd47266ddc3f7eca4e5b00.txt" ]; then
            KEY=$(tr -d '\r\n' < "cb8e34963ecd47266ddc3f7eca4e5b00.txt")
            curl -s --max-time 20 "https://api.indexnow.org/indexnow?url=https%3A%2F%2Fbishowpratap7.github.io%2Ftheworlddesk%2F&key=${KEY}" >/dev/null || true
          fi
